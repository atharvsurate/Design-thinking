<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MHA - Legal DMS Prototype</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
            slate: { 850: '#151e2e', 900: '#0f172a' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-hidden h-screen flex">
  
  <div id="root" class="w-full h-full flex"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Mock Data ---
    const CASES = [
      { id: "CBI-2026-0042", title: "Operation Silken Thread - Financial Fraud", date: "Sep 12, 2026", status: "ACTIVE", docs: 142, class: "SECRET" },
      { id: "DP-2026-8991", title: "FIR 49/2026 - Cyber Espionage Incident", date: "Aug 04, 2026", status: "ACTIVE", docs: 38, class: "TOP_SECRET" },
      { id: "NIA-2025-104", title: "Cross-border Smuggling Intercept", date: "Dec 19, 2025", status: "LEGAL_HOLD", docs: 412, class: "CONFIDENTIAL" },
    ];

    const DOCUMENTS = [
      { id: "DOC-8831", name: "Seizure_Memo_Laptop.pdf", type: "SEIZURE_MEMO", size: "2.4 MB", date: "Today, 10:42 AM", evidence: true, privileged: false },
      { id: "DOC-8830", name: "WhatsApp_Chat_Extract_TargetA.csv", type: "FORENSIC_REPORT", size: "14.1 MB", date: "Yesterday, 14:15 PM", evidence: true, privileged: false },
      { id: "DOC-8824", name: "Legal_Strategy_Memo_Draft.docx", type: "INTELLIGENCE_MEMO", size: "1.2 MB", date: "Sep 12, 2026", evidence: false, privileged: true },
    ];

    // --- Icons Component Helper ---
    const Icon = ({ name, className }) => {
      const iconRef = React.useRef(null);
      useEffect(() => {
        if (iconRef.current) {
          iconRef.current.innerHTML = '';
          const icon = lucide.icons[name];
          if (icon) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '24');
            svg.setAttribute('height', '24');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '2');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');
            if (className) svg.setAttribute('class', className);
            svg.innerHTML = icon[2].map(child => {
              const attrs = Object.entries(child[1]).map(([k, v]) => `${k}="${v}"`).join(' ');
              return `<${child[0]} ${attrs}></${child[0]}>`;
            }).join('');
            iconRef.current.appendChild(svg);
          }
        }
      }, [name, className]);
      return <span ref={iconRef} className={className} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
    };

    // --- Views ---

    const LoginView = ({ onLogin }) => (
      <div className="w-full h-full bg-slate-900 flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
        <div className="w-full max-w-md text-center">
          <div className="flex justify-center text-brand-500 mb-6">
            <Icon name="Shield" className="w-16 h-16" />
          </div>
          <h2 className="text-3xl font-extrabold text-white">Ministry of Home Affairs</h2>
          <p className="mt-2 text-sm text-slate-400">Secure Digital Document Management System</p>
        </div>

        <div className="mt-8 w-full max-w-md bg-slate-800 py-8 px-4 shadow rounded-lg sm:px-10 border border-slate-700">
          <form className="space-y-6" onSubmit={(e) => { e.preventDefault(); onLogin(); }}>
            <div>
              <label className="block text-sm font-medium text-slate-300">NIC Employee ID / NIC-AD</label>
              <input required className="mt-1 block w-full px-3 py-2 border border-slate-600 rounded-md bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm" defaultValue="NIC-994321" />
            </div>

            <div>
              <label className="block text-sm font-medium text-slate-300">Passcode / MFA Token</label>
              <div className="mt-1 relative">
                <input type="password" required className="block w-full px-3 py-2 border border-slate-600 rounded-md bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm" defaultValue="********" />
                <Icon name="Lock" className="absolute right-3 top-2.5 w-4 h-4 text-slate-400" />
              </div>
            </div>

            <button type="submit" className="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none transition-colors">
              Authenticate via NIC
            </button>
            
            <div className="mt-4 text-center">
              <span className="text-xs text-slate-500 uppercase tracking-wider font-semibold">Protected by AES-256-GCM & Ed25519 Audit Chain</span>
            </div>
          </form>
        </div>
      </div>
    );

    const Sidebar = ({ setView }) => (
      <div className="w-64 bg-slate-900 text-white flex flex-col h-full flex-shrink-0">
        <div className="h-16 flex items-center px-6 border-b border-slate-800">
          <Icon name="ShieldAlert" className="w-6 h-6 text-brand-500 mr-2" />
          <span className="font-bold text-lg tracking-tight">MHA-DMS</span>
        </div>
        <div className="flex-1 py-6 px-4 space-y-2">
          <button onClick={() => setView('dashboard')} className="w-full flex items-center px-4 py-2 bg-brand-600/20 text-brand-400 rounded-md font-medium">
            <Icon name="Folder" className="w-5 h-5 mr-3" /> My Cases
          </button>
          <button className="w-full flex items-center px-4 py-2 text-slate-400 hover:bg-slate-800 hover:text-slate-200 rounded-md font-medium transition-colors">
            <Icon name="Search" className="w-5 h-5 mr-3" /> Advanced Search
          </button>
          <button className="w-full flex items-center px-4 py-2 text-slate-400 hover:bg-slate-800 hover:text-slate-200 rounded-md font-medium transition-colors">
            <Icon name="History" className="w-5 h-5 mr-3" /> Audit Logs
          </button>
        </div>
        <div className="p-4 border-t border-slate-800">
          <div className="flex items-center mb-4">
            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-sm font-bold">IO</div>
            <div className="ml-3">
              <p className="text-sm font-medium">Insp. R. Kumar</p>
              <p className="text-xs text-slate-400">LEAD_IO | CBI</p>
            </div>
          </div>
          <button onClick={() => setView('login')} className="flex items-center text-sm text-slate-400 hover:text-white transition-colors">
            <Icon name="LogOut" className="w-4 h-4 mr-2" /> Secure Logout
          </button>
        </div>
      </div>
    );

    const DashboardView = ({ openCase }) => (
      <div className="p-6 max-w-6xl mx-auto space-y-6 w-full">
        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex items-center">
            <div className="p-3 bg-brand-100 text-brand-600 rounded-md mr-4"><Icon name="Folder" className="w-5 h-5" /></div>
            <div><p className="text-sm text-gray-500 font-medium">Active Cases</p><p className="text-2xl font-bold">12</p></div>
          </div>
          <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex items-center">
            <div className="p-3 bg-indigo-100 text-indigo-600 rounded-md mr-4"><Icon name="FileSearch" className="w-5 h-5" /></div>
            <div><p className="text-sm text-gray-500 font-medium">Documents</p><p className="text-2xl font-bold">1,842</p></div>
          </div>
          <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex items-center">
            <div className="p-3 bg-emerald-100 text-emerald-600 rounded-md mr-4"><Icon name="Shield" className="w-5 h-5" /></div>
            <div><p className="text-sm text-gray-500 font-medium">Audit Integrity</p><p className="text-xl font-bold text-emerald-600">VERIFIED</p></div>
          </div>
        </div>

        <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
          <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
            <h2 className="text-lg font-semibold text-gray-800">My Assigned Cases</h2>
            <button className="px-4 py-2 bg-brand-600 text-white text-sm font-medium rounded-md hover:bg-brand-700 transition-colors shadow-sm">
              + Open New Case
            </button>
          </div>
          <table className="w-full text-left text-sm text-gray-600">
            <thead className="bg-gray-50 text-gray-500 uppercase text-xs font-semibold border-b border-gray-200">
              <tr>
                <th className="px-6 py-3">Case ID</th>
                <th className="px-6 py-3">Title / Subject</th>
                <th className="px-6 py-3">Classification</th>
                <th className="px-6 py-3">Status</th>
                <th className="px-6 py-3 text-center">Docs</th>
                <th className="px-6 py-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-200">
              {CASES.map((c, i) => (
                <tr key={i} className="hover:bg-gray-50">
                  <td className="px-6 py-4 font-medium text-gray-900">{c.id}</td>
                  <td className="px-6 py-4">{c.title}</td>
                  <td className="px-6 py-4">
                    <span className={`px-2 py-1 rounded text-xs font-bold border ${c.class === 'TOP_SECRET' ? 'bg-red-100 text-red-800 border-red-200' : c.class === 'SECRET' ? 'bg-orange-100 text-orange-800 border-orange-200' : 'bg-gray-100 text-gray-800 border-gray-200'}`}>
                      {c.class}
                    </span>
                  </td>
                  <td className="px-6 py-4">
                    <span className={`px-2 py-1 rounded-full text-xs font-medium ${c.status === 'ACTIVE' ? 'bg-green-100 text-green-700' : 'bg-purple-100 text-purple-700'}`}>
                      {c.status}
                    </span>
                  </td>
                  <td className="px-6 py-4 text-center font-medium">{c.docs}</td>
                  <td className="px-6 py-4 text-right">
                    <button onClick={() => openCase(c)} className="text-brand-600 hover:text-brand-800 font-medium">Open Case &rarr;</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );

    const CaseView = ({ caseInfo, goBack }) => (
      <div className="p-6 max-w-6xl mx-auto space-y-6 w-full">
        <div className="flex items-center space-x-4 mb-2">
          <button onClick={goBack} className="p-2 bg-white border border-gray-200 rounded-md hover:bg-gray-50 text-gray-500 shadow-sm">
            <Icon name="ArrowLeft" className="w-5 h-5" />
          </button>
          <div>
            <h1 className="text-2xl font-bold text-gray-800">{caseInfo.id}</h1>
            <p className="text-gray-500 text-sm">{caseInfo.title}</p>
          </div>
        </div>

        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-6 flex justify-between items-center">
          <div className="flex space-x-8">
            <div><p className="text-xs text-gray-400 font-bold uppercase tracking-wider">Vault KEK</p><p className="font-mono text-sm text-gray-700 mt-1 flex items-center"><Icon name="Lock" className="w-3 h-3 mr-1 text-emerald-500"/> transit/keys/case-cbi-42</p></div>
            <div><p className="text-xs text-gray-400 font-bold uppercase tracking-wider">Lead IO</p><p className="font-medium text-sm text-gray-700 mt-1">Insp. R. Kumar (CBI)</p></div>
            <div><p className="text-xs text-gray-400 font-bold uppercase tracking-wider">Storage</p><p className="font-medium text-sm text-gray-700 mt-1">NIC MeghRaj</p></div>
          </div>
          <button className="flex items-center px-4 py-2 bg-brand-600 text-white font-medium rounded-md hover:bg-brand-700 shadow-sm transition-colors">
            <Icon name="Upload" className="w-4 h-4 mr-2" /> Upload Evidence
          </button>
        </div>

        <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
          <div className="px-6 py-4 border-b border-gray-200 flex items-center bg-gray-50/50">
            <Icon name="Search" className="text-gray-400 mr-2 w-4 h-4" />
            <input type="text" placeholder="Search decrypted text via OpenSearch (Hindi/English)..." className="bg-transparent border-none outline-none w-full text-sm text-gray-700 placeholder-gray-400 focus:ring-0" />
          </div>
          <table className="w-full text-left text-sm text-gray-600">
            <thead className="bg-gray-50 text-gray-500 uppercase text-xs font-semibold border-b border-gray-200">
              <tr>
                <th className="px-6 py-3">Document Name</th>
                <th className="px-6 py-3">Type</th>
                <th className="px-6 py-3">Security Tags</th>
                <th className="px-6 py-3">Size & Date</th>
                <th className="px-6 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-200">
              {DOCUMENTS.map((doc, i) => (
                <tr key={i} className="hover:bg-gray-50">
                  <td className="px-6 py-4">
                    <div className="flex items-center">
                      <Icon name="FileText" className="text-gray-400 mr-3 w-5 h-5" />
                      <span className="font-medium text-gray-900">{doc.name}</span>
                    </div>
                  </td>
                  <td className="px-6 py-4 text-xs font-medium text-gray-500">{doc.type.replace('_', ' ')}</td>
                  <td className="px-6 py-4 flex flex-wrap gap-2">
                    {doc.evidence && (
                      <span className="px-2 py-1 rounded bg-amber-100 text-amber-800 border border-amber-200 text-[10px] font-bold tracking-wider flex items-center">
                        <Icon name="Lock" className="w-3 h-3 mr-1"/> WORM EVIDENCE
                      </span>
                    )}
                    {doc.privileged && (
                      <span className="px-2 py-1 rounded bg-red-100 text-red-800 border border-red-200 text-[10px] font-bold tracking-wider flex items-center">
                        <Icon name="ShieldCheck" className="w-3 h-3 mr-1"/> PRIVILEGED
                      </span>
                    )}
                  </td>
                  <td className="px-6 py-4">
                    <p className="text-gray-900 font-medium">{doc.size}</p>
                    <p className="text-xs text-gray-400">{doc.date}</p>
                  </td>
                  <td className="px-6 py-4 text-right space-x-1">
                    <button className="p-2 text-gray-400 hover:text-brand-600 hover:bg-brand-50 rounded transition-colors" title="View (Watermarked)"><Icon name="Eye" className="w-5 h-5" /></button>
                    <button className="p-2 text-gray-400 hover:text-brand-600 hover:bg-brand-50 rounded transition-colors" title="Export Chain of Custody PDF"><Icon name="ShieldCheck" className="w-5 h-5" /></button>
                    <button className="p-2 text-gray-400 hover:text-brand-600 hover:bg-brand-50 rounded transition-colors" title="Download Decrypted"><Icon name="Download" className="w-5 h-5" /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );

    // --- Main App Container ---
    const App = () => {
      const [view, setView] = useState('login'); // 'login', 'dashboard', 'case'
      const [activeCase, setActiveCase] = useState(null);

      if (view === 'login') {
        return <LoginView onLogin={() => setView('dashboard')} />;
      }

      return (
        <div className="flex w-full h-full bg-gray-50 overflow-hidden">
          <Sidebar setView={setView} />
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shadow-sm flex-shrink-0">
              <h1 className="text-xl font-semibold text-gray-800">
                {view === 'dashboard' ? 'Case Dashboard' : 'Case Documents'}
              </h1>
              <div className="flex items-center space-x-4">
                <span className="px-3 py-1 bg-green-100 text-green-800 text-xs font-bold rounded-full border border-green-200 flex items-center">
                  <span className="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                  Vault Connected
                </span>
              </div>
            </header>
            <main className="flex-1 overflow-auto">
              {view === 'dashboard' && <DashboardView openCase={(c) => { setActiveCase(c); setView('case'); }} />}
              {view === 'case' && <CaseView caseInfo={activeCase} goBack={() => setView('dashboard')} />}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
